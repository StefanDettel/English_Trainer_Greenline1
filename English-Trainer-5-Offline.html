<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body>
<title>English Trainer 5 Offline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one 640px column like an exercise book, bottom tab bar; Green Line green as accent, pillar-box red only on the play button */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --surface-2:#F3F7F4; --ink:#14211B; --ink-2:#43544B; --ink-3:#73847A;
  --line:#D3DED7; --accent:#1D6B52; --accent-ink:#FFFFFF; --accent-soft:#D7EBE2;
  --red:#C23B2E; --red-ink:#FFFFFF; --paper:#FBFCF6; --rule:#C9DCEB; --margin:#E8A3A3;
  --good:#1E7A4C; --good-soft:#DDF1E6; --bad:#B23A3A; --bad-soft:#F7E0E0; --warn-soft:#FFF2CC;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;
  --en:"Literata",Georgia,"Times New Roman",serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0E1512; --surface:#16211C; --surface-2:#1C2A24; --ink:#E6EFEA; --ink-2:#B1C2B8; --ink-3:#85978C;
  --line:#2A3A33; --accent:#6CC6A2; --accent-ink:#0E1512; --accent-soft:#1D3A2F;
  --red:#F07A6C; --red-ink:#1A0E0C; --paper:#18241F; --rule:#24384A; --margin:#5A2E2E;
  --good:#6FCF9B; --good-soft:#173527; --bad:#F08A8A; --bad-soft:#3E1F22; --warn-soft:#3A3318;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0E1512; --surface:#16211C; --surface-2:#1C2A24; --ink:#E6EFEA; --ink-2:#B1C2B8; --ink-3:#85978C;
  --line:#2A3A33; --accent:#6CC6A2; --accent-ink:#0E1512; --accent-soft:#1D3A2F;
  --red:#F07A6C; --red-ink:#1A0E0C; --paper:#18241F; --rule:#24384A; --margin:#5A2E2E;
  --good:#6FCF9B; --good-soft:#173527; --bad:#F08A8A; --bad-soft:#3E1F22; --warn-soft:#3A3318;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:14px 8px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.01em;color:var(--accent)}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;letter-spacing:.03em;color:var(--ink-3)}
.sync{font-size:12px;color:var(--ink-3);white-space:nowrap}
h2{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
p{margin:0}
.muted{color:var(--ink-3);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.good{background:var(--good-soft);color:var(--good);border-color:transparent}
button.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
button.ghost{background:transparent}
button.small,.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.chip:focus-within,.seg label:focus-within,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.grow{flex:1 1 0;min-width:0}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
label.lbl{font-size:13px;color:var(--ink-2);font-weight:700;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;user-select:none;position:relative}
label.chip input{position:absolute;opacity:0;pointer-events:none}
label.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:10px 6px;font-size:14px;cursor:pointer;background:var(--surface-2);position:relative}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:700}
.subnav{display:flex;gap:8px}
.subnav button{flex:1;min-height:40px;font-size:15px}
.subnav button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:transparent;border:0;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--ink-3);min-height:54px;padding:4px 2px;min-width:0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* quiz */
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.flash{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;
  background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 31px,transparent 31px)}
.flash .dir{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.flash .word{font-family:var(--en);font-size:32px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.flash .word.de{font-family:var(--body);font-size:27px;font-weight:700}
.answer{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-size:20px;font-weight:700;overflow-wrap:anywhere;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.answer.en{font-family:var(--en);font-size:24px;font-weight:600}
.yours{font-size:14px;color:var(--ink-2);text-align:center}
.match{color:var(--good);font-weight:700}
.say{min-height:36px;width:36px;padding:0;border-radius:50%;flex:0 0 auto}
.say svg{width:18px;height:18px}
.play{width:76px;height:76px;border-radius:50%;background:var(--red);color:var(--red-ink);border:0;padding:0;flex:0 0 auto}
.play svg{width:32px;height:32px}
.play.on{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stamp{flex:0 0 auto;width:100px;height:100px;border-radius:50%;border:4px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-7deg);color:var(--accent)}
.stamp b{font-family:var(--display);font-size:44px;line-height:1}
.stamp span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.stamp.g1,.stamp.g2{color:var(--good);border-color:var(--good)}
.stamp.g5,.stamp.g6{color:var(--bad);border-color:var(--bad)}
.miss{display:flex;flex-direction:column;gap:6px}
.miss div{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;background:var(--bad-soft);border-radius:8px;font-size:15px}
.miss div b{font-family:var(--en);font-size:17px}

.vtable{width:100%;border-collapse:collapse;font-size:15px}
.vtable td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable input{min-height:38px;padding:6px 8px}
.vtable td.x{width:40px;text-align:right}
.scroll{overflow-x:auto}
.listitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:0}
.listitem .name{font-weight:700}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--ink-2);border-radius:6px;padding:2px 6px;white-space:nowrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* exercise book paper for English texts */
.paper{font-family:var(--en);font-size:19px;line-height:32px;background-color:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px 12px 44px;
  background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 31px,transparent 31px),repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);background-position:0 0,0 11px}
.paper .ttl{font-family:var(--display);font-weight:800;font-size:18px;display:block;color:var(--accent)}
.paper p+p{margin-top:0}
.paper p{text-indent:0}
.dialog{display:flex;flex-direction:column}
.dialog .ln{display:flex;gap:8px;align-items:flex-start;border-radius:6px}
.dialog .ln.cur{background:var(--warn-soft)}
.dialog .who{font-family:var(--body);font-weight:700;font-size:15px;color:var(--ink-2);flex:0 0 auto;min-width:64px}
.dialog .tx{min-width:0;overflow-wrap:anywhere}
.qlist{display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q .qt{font-family:var(--en);font-size:18px;font-weight:600}
.q .qt .n{font-family:var(--body);color:var(--ink-3);font-weight:700;font-size:14px;margin-right:6px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:var(--en);font-size:17px;position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.model{background:var(--good-soft);border-radius:10px;padding:10px 12px;font-family:var(--en);font-size:17px}
.feedback{font-size:14px;color:var(--ink-2)}
.player{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.player .info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 180px}

/* grammar */
.unitgrp{display:flex;flex-direction:column;gap:8px}
.unitgrp .uh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.unitgrp .uh b{font-family:var(--display);font-weight:800;font-size:16px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{font-weight:400;font-size:15px;min-height:40px;padding:8px 12px}
.topics button .done{color:var(--good);font-weight:700}
.rule{background:var(--surface-2);border-radius:12px;padding:14px;font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:8px}
.rule ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rule .ex{font-family:var(--en);font-size:16.5px}
.rule .ex b{color:var(--accent)}
.gaps{display:flex;flex-direction:column;gap:12px;counter-reset:g}
.gap{display:flex;gap:10px;align-items:baseline;font-family:var(--en);font-size:18px;line-height:1.9;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gap:last-child{border-bottom:0}
.gap .n{font-family:var(--body);font-size:14px;color:var(--ink-3);font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 22px}
.gap .s{min-width:0;flex:1}
.gap input[type=text],.gap select{display:inline-block;width:auto;min-width:96px;max-width:100%;min-height:36px;padding:4px 8px;font-family:var(--en);font-size:17px;border-width:0 0 2px;border-radius:6px 6px 0 0;vertical-align:baseline}
.gap input.ok,.gap select.ok{border-color:var(--good);background:var(--good-soft)}
.gap input.no,.gap select.no{border-color:var(--bad);background:var(--bad-soft)}
.gap .fix{font-family:var(--body);font-size:14px;color:var(--good);font-weight:700;margin-left:6px}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.progress>i{transition:none}.play.on{animation:none}}

.gtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gtable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;padding:6px 4px}
.gtable td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.gtable td.n{font-family:var(--display);font-weight:800;font-size:22px;width:44px}
.gtable td.range{color:var(--ink-2);font-size:14px}
.gtable input{width:84px;text-align:center}
.warn{color:var(--bad);font-size:14px}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist .h:last-child{border-bottom:0}
.hist .g{font-family:var(--display);font-weight:800;font-size:21px;width:30px;text-align:center}
.links{display:flex;flex-direction:column;gap:8px}
.links a{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
details summary{cursor:pointer}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">English Trainer<small>Klasse 5 · passend zu Green Line 1 Bayern · Offline-Version</small></div>
    <div class="sync" id="sync">auf diesem Gerät gespeichert</div>
  </header>
  <section id="v-vocab" class="stack"></section>
  <section id="v-listen" class="stack" hidden></section>
  <section id="v-read" class="stack" hidden></section>
  <section id="v-gram" class="stack" hidden></section>
  <section id="v-grades" class="stack" hidden></section>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <button data-tab="vocab" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h6M7 14h10"/></svg>Vokabeln</button>
  <button data-tab="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Hören</button>
  <button data-tab="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg>Lesen</button>
  <button data-tab="gram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 9 5h2l5 15M6 15h8"/><path d="M17 11h4M19 9v4"/></svg>Grammatik</button>
  <button data-tab="grades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M8.5 13 7 21l5-3 5 3-1.5-8"/></svg>Noten</button>
</div></nav>

<script>
(() => {
"use strict";
const OFFLINE = true;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const GRADE_NAMES = {1:"sehr gut",2:"gut",3:"befriedigend",4:"ausreichend",5:"mangelhaft",6:"ungenügend"};
const ICON_SAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>';

/* ---------- Green Line 1 Bayern: units ---------- */
const UNITS = [
  {n:1, t:"It's fun at home", topic:"Haus und Wohnung, Zimmer, Möbel, Familie", gram:"to be, there is/there are, have got/has got, Plural der Nomen"},
  {n:2, t:"I'm new at TTS", topic:"neue Schule in London (Greenwich), Schulfächer, Schulsachen, Stundenplan", gram:"can/can't, Possessivbegleiter (my, your, his, her …), s-Genitiv"},
  {n:3, t:"I like my busy days", topic:"Tagesablauf, Uhrzeit, Freizeit, Menschen beschreiben", gram:"simple present (Aussagesätze), Häufigkeitsadverbien, Satzstellung"},
  {n:4, t:"Let's do something fun", topic:"Freizeit, Ausflüge in Greenwich und London, Sehenswürdigkeiten", gram:"simple present: Verneinung und Fragen mit do/does, Objektpronomen, Fragewörter"},
  {n:5, t:"Let's go shopping", topic:"Einkaufen, Kleidung, Geld (pounds), Geschenke, Markt", gram:"present progressive, simple present vs. present progressive, some/any, much/many/a lot of"},
  {n:6, t:"It's my party", topic:"Geburtstag, Party, Einladung, Essen, Erlebnisse", gram:"simple past (was/were, regelmäßige und unregelmäßige Verben, Verneinung, Fragen)"}
];
const unitLabel = n => `Unit ${n}: ${UNITS[n-1].t}`;

/* ---------- example vocabulary (own word lists by topic, not the book's list) ---------- */
const EXAMPLES = [

/* ---------- answer checking ---------- */
function canon(s){
  s = String(s ?? "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;:]+$/, "").trim();
  const R = [
    [/\b(he|she|it|there|that|what|who|where)'s got\b/g, "$1 has got"], [/(^|\s)'s got\b/g, "$1has got"],
    [/\b(he|she|it|there|that|what|who|where|how)'s\b/g, "$1 is"], [/(^|\s)'s\b/g, "$1is"],
    [/\bcan't\b/g, "cannot"], [/\bcan not\b/g, "cannot"], [/\bwon't\b/g, "will not"], [/n't\b/g, " not"],
    [/'m\b/g, " am"], [/'re\b/g, " are"], [/'ve\b/g, " have"], [/'ll\b/g, " will"]
  ];
  for (const [re, to] of R) s = s.replace(re, to);
  return s.replace(/\s+/g, " ").trim();
}
const isRight = (typed, answers) => { const c = canon(typed); return !!c && answers.some(a => canon(a) === c); };
function wordForms(en){ return String(en).split(/[,;/]/).map(x => x.replace(/\(.*?\)/g, "").replace(/^\s*to\s+/i, "").replace(/[.!?]/g, "").trim().toLowerCase()).filter(Boolean); }
function vocabMatch(typed, en){ const t = String(typed).toLowerCase().replace(/^\s*to\s+/, "").replace(/[.!?]/g, "").trim(); return !!t && wordForms(en).includes(t); }

/* ---------- speech (English voices of the device) ---------- */
const TTS = { ok: typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined", voices: [] };
function loadVoices(){ try { TTS.voices = speechSynthesis.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang)); } catch(e){ TTS.voices = []; } }
if (TTS.ok) { loadVoices(); try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch(e){ speechSynthesis.onvoiceschanged = loadVoices; } }
const FEMALE = /female|woman|samantha|serena|kate|stephanie|martha|fiona|moira|karen|tessa|victoria|zira|susan|hazel|libby|sonia|emma|amy|olivia|maisie|catherine/i;
const MALE = /\bmale\b|daniel|arthur|oliver|george|ryan|thomas|alex|fred|david|mark|james|rishi|guy|brian|aaron|gordon/i;
function orderedVoices(){ const gb = TTS.voices.filter(v => /GB/i.test(v.lang)); return [...gb, ...TTS.voices.filter(v => !/GB/i.test(v.lang))]; }
function voiceFor(gender, idx){
  const all = orderedVoices(); if (!all.length) return null;
  let pool = all.filter(v => gender === "f" ? FEMALE.test(v.name) : gender === "m" ? (MALE.test(v.name) && !FEMALE.test(v.name)) : true);
  if (!pool.length) pool = all; return pool[idx % pool.length];
}
let speakToken = 0;
function stopSpeak(){ speakToken++; if (TTS.ok) try { speechSynthesis.cancel(); } catch(e){} }
function splitSentences(t){ return (String(t).match(/[^.!?\n]+[.!?]+["')”]*|[^.!?\n]+$/gm) || [t]).map(s => s.trim()).filter(Boolean); }
/* parts: [{text, gender, spk}]; returns false if speech is unavailable */
function speakParts(parts, {rate = 0.95, onPart, onEnd} = {}){
  if (!TTS.ok) { toast("Vorlesen geht auf diesem Gerät nicht."); return false; }
  stopSpeak(); const token = speakToken;
  const pitches = [1, 1.18, 0.88, 1.08];
  const voiceBySpk = {}; const used = {};
  parts.forEach((p, i) => {
    const key = p.spk ?? "_";
    if (!(key in voiceBySpk)) { const g = p.gender || ""; used[g] = (used[g] || 0); voiceBySpk[key] = { v: voiceFor(g, used[g]), pitch: pitches[Object.keys(voiceBySpk).length % pitches.length] }; used[g]++; }
    const vv = voiceBySpk[key];
    const u = new SpeechSynthesisUtterance(p.text);
    if (vv.v) { u.voice = vv.v; u.lang = vv.v.lang; } else u.lang = "en-GB";
    u.rate = rate; u.pitch = vv.pitch;
    u.onstart = () => { if (token === speakToken && onPart) onPart(p.idx ?? i); };
    if (i === parts.length - 1) u.onend = () => { if (token === speakToken && onEnd) onEnd(); };
    u.onerror = e => { if (token === speakToken && e && e.error !== "interrupted" && e.error !== "canceled" && onEnd) onEnd(); };
    speechSynthesis.speak(u);
  });
  return true;
}
function sayWord(text){ speakParts([{text: String(text).replace(/\(.*?\)/g, "")}], {rate: 0.85}); }

function subnavHTML(){ return `<div class="subnav" role="group" aria-label="Vokabeln"><button class="small" data-sub="quiz" aria-pressed="${state.vsub==="quiz"}">Abfrage</button><button class="small" data-sub="lists" aria-pressed="${state.vsub==="lists"}">Meine Listen</button></div>`; }
function bindSubnav(v){ v.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { state.vsub = b.dataset.sub; state.confirmDel = null; renderVocab(); }); }

function renderQuiz(){
  const v = $("#v-vocab"); const q = state.quiz;
  if (!state.quizSetup.sel) state.quizSetup.sel = defaultSel();
  if (!q) {
    const s = state.quizSetup;
    v.innerHTML = `${subnavHTML()}
      <div class="card">
        <h2>Vokabeltest</h2>
        ${state.lists.length ? "" : `<p class="muted">Noch keine eigenen Vokabeln – unten sind <span class="badge">Beispiel</span>-Listen. ${OFFLINE ? "Eigene Wörter gibst du unter „Meine Listen“ ein." : "Die Seiten aus deinem Buch scannst du unter „Meine Listen“."}</p>`}
        <div class="stack"><h3>Listen</h3>${listChips("qsel", s.sel)}</div>
        <div class="stack"><h3>Abfrage</h3>
          <div class="seg" role="radiogroup">
            ${[["en","Englisch → Deutsch"],["de","Deutsch → Englisch"]].map(([k,t]) => `<label><input type="radio" name="qdir" value="${k}" ${s.dir===k?"checked":""}>${t}</label>`).join("")}
          </div>
          <div class="seg" role="radiogroup">
            ${[["audio","Hören & schreiben"],["mix","gemischt"]].map(([k,t]) => `<label><input type="radio" name="qdir" value="${k}" ${s.dir===k?"checked":""}>${t}</label>`).join("")}
          </div></div>
        <div class="stack"><h3>Anzahl Wörter</h3>
          <div class="seg" role="radiogroup">
            ${[["10","10"],["20","20"],["30","30"],["all","alle"]].map(([k,t]) => `<label><input type="radio" name="qcnt" value="${k}" ${s.count===k?"checked":""}>${t}</label>`).join("")}
          </div></div>
        <p class="muted" id="qinfo"></p>
        <button class="primary" id="qstart">Test starten</button>
      </div>`;
    bindSubnav(v);
    const upd = () => { s.sel = readChips(v, "qsel"); s.dir = $("input[name=qdir]:checked", v).value; s.count = $("input[name=qcnt]:checked", v).value;
      const n = selectedWords(s.sel).length; const take = s.count === "all" ? n : Math.min(n, +s.count);
      $("#qinfo").textContent = n ? `${take} von ${n} Vokabeln in zufälliger Reihenfolge.${s.dir === "audio" ? " Du hörst das englische Wort und schreibst es auf." : ""}` : "Wähle mindestens eine Liste.";
      $("#qstart").disabled = !n; };
    v.onchange = upd; upd();
    $("#qstart").onclick = () => {
      const words = shuffle(selectedWords(s.sel)); const take = s.count === "all" ? words.length : Math.min(words.length, +s.count);
      const dirs = ["en","de","audio"];
      state.quiz = { items: words.slice(0, take).map(w => ({...w, dir: s.dir === "mix" ? dirs[Math.floor(Math.random()*3)] : s.dir})), i: 0, shown: false, wrong: [], typed: "", done: false,
        names: s.sel.map(id => listById(id)?.name).filter(Boolean).join(", ") };
      renderQuiz(); autoSay();
    };
    return;
  }
  v.onchange = null;
  if (q.done) return renderQuizResult();
  const it = q.items[q.i];
  const prompt = it.dir === "en" ? it.en : it.de;
  const label = it.dir === "en" ? "Was heißt das auf Deutsch?" : it.dir === "de" ? "Wie heißt das auf Englisch?" : "Hör zu und schreib das Wort auf Englisch";
  const typedOk = q.shown && q.typed && (it.dir === "en" ? false : vocabMatch(q.typed, it.en));
  v.innerHTML = `
    <div class="card">
      <div class="qmeta"><span>Wort ${q.i+1} von ${q.items.length}</span><span>${q.wrong.length} Fehler</span></div>
      <div class="progress"><i style="width:${(q.i/q.items.length)*100}%"></i></div>
      <div class="flash"><span class="dir">${label}</span>
        ${it.dir === "audio" ? `<button class="play" id="qplay" aria-label="Wort anhören">${ICON_SAY}</button><span class="muted">Nochmal tippen = nochmal hören</span>`
          : `<span class="word ${it.dir === "de" ? "de" : ""}">${esc(prompt)}</span>${it.dir === "en" ? `<button class="say small" id="qsay" aria-label="Aussprache anhören">${ICON_SAY}</button>` : ""}`}
      </div>
      ${q.shown ? `
        ${q.typed ? `<p class="yours">Deine Antwort: <b>${esc(q.typed)}</b>${typedOk ? ` <span class="match">✓ passt</span>` : ""}</p>` : ""}
        <div class="answer ${it.dir !== "en" ? "en" : ""}">${esc(it.dir === "en" ? it.de : it.en)}${it.dir !== "en" ? "" : `<span class="muted" style="font-weight:400;font-size:15px">(${esc(it.en)})</span>`}<button class="say small" id="qsay2" aria-label="Aussprache anhören">${ICON_SAY}</button></div>
        ${it.dir === "audio" ? `<p class="muted" style="text-align:center">${esc(it.de)}</p>` : ""}
        <p class="muted" style="text-align:center">Hattest du es richtig${it.dir !== "en" ? " – auch die Rechtschreibung" : ""}?</p>
        <div class="row"><button class="bad grow" id="qno">✗ Falsch</button><button class="good grow" id="qyes">✓ Richtig</button></div>
      ` : `
        <input type="text" id="qtyped" placeholder="${it.dir === "en" ? "Deutsche Bedeutung (optional)" : "Englisches Wort"}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(q.typed)}" lang="${it.dir === "en" ? "de" : "en"}">
        <button class="primary" id="qshow">Lösung zeigen</button>
      `}
      <button class="ghost small" id="qquit">Test abbrechen</button>
    </div>`;
  const p = $("#qplay"); if (p) p.onclick = () => sayWord(it.en);
  const s1 = $("#qsay"); if (s1) s1.onclick = () => sayWord(it.en);
  const s2 = $("#qsay2"); if (s2) s2.onclick = () => sayWord(it.en);
  if (!q.shown) { const inp = $("#qtyped"); inp.addEventListener("keydown", e => { if (e.key === "Enter") $("#qshow").click(); });
    $("#qshow").onclick = () => { q.typed = inp.value.trim(); q.shown = true; renderQuiz(); if (it.dir === "de") sayWord(it.en); }; }
  else {
    const next = wrong => { if (wrong) q.wrong.push(it); q.i++; q.shown = false; q.typed = "";
      if (q.i >= q.items.length) { q.done = true; const errors = q.wrong.length;
        addResult({ id: uid("r"), at: Date.now(), kind: "vokabeln", label: q.names, total: q.items.length, errors, grade: gradeFor(errors) }); }
      renderQuiz(); autoSay(); };
    $("#qyes").onclick = () => next(false); $("#qno").onclick = () => next(true);
  }
  $("#qquit").onclick = () => { stopSpeak(); state.quiz = null; renderQuiz(); };
}
function autoSay(){ const q = state.quiz; if (q && !q.done && !q.shown) { const it = q.items[q.i]; if (it.dir === "audio" || it.dir === "en") sayWord(it.en); } }
function renderQuizResult(){
  const q = state.quiz; const e = q.wrong.length; const g = gradeFor(e);
  $("#v-vocab").innerHTML = `
    <div class="card">
      <h2>Ergebnis</h2>
      <div class="result">${stampHTML(g)}
        <div class="stack"><p style="font-size:20px;font-weight:700">${e} Fehler bei ${q.items.length} Wörtern</p>
        <p class="muted">${q.items.length - e} richtig · Bewertung nach deiner Notentabelle</p></div></div>
      ${e ? `<h3>Das übst du nochmal</h3><div class="miss">${q.wrong.map(w => `<div><b>${esc(w.en)}</b><span>${esc(w.de)}</span></div>`).join("")}</div>` : `<p>Alles gewusst. Well done!</p>`}
      <div class="row">${e ? `<button class="primary grow" id="qretry">Falsche wiederholen</button>` : ""}<button class="grow" id="qnew">Neuer Test</button></div>
    </div>`;
  $("#qnew").onclick = () => { state.quiz = null; renderQuiz(); };
  const r = $("#qretry"); if (r) r.onclick = () => { state.quiz = { items: shuffle(q.wrong), i: 0, shown: false, wrong: [], typed: "", done: false, names: q.names + " (Wiederholung)" }; renderQuiz(); autoSay(); };
}

function nextName(){ return "Liste " + (state.lists.length + 1); }
function parsePaste(txt){
  const out = [];
  for (let line of txt.split(/\r?\n/)) { line = line.trim(); if (!line) continue;
    const m = line.split(/\s*(?:\t|\s[–—-]\s|\s=\s|:\s|;\s)\s*/);
    if (m.length >= 2) out.push({ en: m[0].trim(), de: m.slice(1).join(", ").trim() });
  }
  return out;
}

      <div class="row"><button class="small" id="drow">+ Zeile</button>${d.paste ? "" : `<button class="small" id="dpastebtn">Text einfügen</button>`}</div>
      <div class="row"><button class="primary grow" id="dsave" ${d.words.length && !d.scanning ? "" : "disabled"}>Speichern</button><button class="grow" id="dcancel">Abbrechen</button></div>

        ? `<div class="confirm">Liste „${esc(d.name)}“ wirklich löschen?<button class="bad small" id="ddelyes">Ja, löschen</button><button class="small" id="ddelno">Nein</button></div>`

  const sync = () => { d.name = $("#dname").value; v.querySelectorAll("input[data-i]").forEach(inp => { d.words[+inp.dataset.i][inp.dataset.k] = inp.value; }); };
  v.querySelectorAll("input").forEach(inp => inp.addEventListener("input", sync));
  v.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { sync(); d.words.splice(+b.dataset.del, 1); renderDraft(); });
  $("#drow").onclick = () => { sync(); d.words.push({en:"",de:""}); renderDraft(); const ins = v.querySelectorAll('input[data-k="en"]'); ins[ins.length-1]?.focus(); };
  const pb = $("#dpastebtn"); if (pb) pb.onclick = () => { sync(); d.paste = true; renderDraft(); };

    const ix = state.lists.findIndex(l => l.id === list.id); if (ix >= 0) state.lists[ix] = list; else state.lists.push(list);
    state.quizSetup.sel = [list.id];
    state.draft = null; renderLists(); toast(`„${list.name}“ gespeichert – ${words.length} Vokabeln`); await saveList(list); };
  const dd = $("#ddel"); if (dd) dd.onclick = () => { sync(); state.confirmDel = d.id; renderDraft(); };
  const dy = $("#ddelyes"); if (dy) dy.onclick = async () => { const id = d.id; state.lists = state.lists.filter(l => l.id !== id); state.quizSetup.sel = null; state.draft = null; state.confirmDel = null; renderLists(); toast("Liste gelöscht"); await removeList(id); };
  const dn = $("#ddelno"); if (dn) dn.onclick = () => { state.confirmDel = null; renderDraft(); };

async function shrink(file){
  try {
    const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
    const max = 1800; const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)); return blob || file;
  } catch(e){ return file; }
}
async function scanPhotos(files){
  const max = sampleCaps?.images?.maxCount || 4; files = files.slice(0, max);
  const blobs = await Promise.all(files.map(shrink));
  const d = state.draft = { id: null, name: nextName(), words: [], scanning: true, thumbs: blobs.map(b => URL.createObjectURL(b)) };
  renderDraft();
  const prompt = `${blobs.length > 1 ? "Die " + blobs.length + " Fotos zeigen" : "Das Foto zeigt"} eine Vokabelliste Englisch–Deutsch aus einem deutschen Englisch-Schulbuch (Klasse 5) oder einem Schulheft.
Lies ALLE Vokabeln vollständig und in der Reihenfolge der Seite aus.
- "en": das englische Stichwort genau wie abgedruckt (Verben mit "to", unregelmäßige Formen in Klammern übernehmen, z. B. "to buy (bought)").
- "de": alle deutschen Bedeutungen, durch Komma getrennt.
- Ignoriere Lautschrift (z. B. [ˈkɪtʃɪn]), Beispielsätze, Merkkästen, Seitenzahlen und Überschriften.
- Wenn ein Wort schwer lesbar ist, gib deine beste Lesung an.
Wenn eine Unit, ein Abschnitt oder eine Überschrift erkennbar ist, gib sie als "title" an (z. B. "Unit 3 Station 1"), sonst "".
Antworte NUR mit JSON: {"title": "...", "words": [{"en": "...", "de": "..."}]}`;
  try {
    const r = await sample.json(prompt, { images: blobs, modelTier: "default" });
    const words = (Array.isArray(r?.words) ? r.words : []).map(w => ({en: String(w.en||"").trim(), de: String(w.de||"").trim()})).filter(w => w.en);
    if (state.draft !== d) return;
    d.words = words; if (r?.title) d.name = String(r.title).slice(0, 60);
    if (!words.length) toast("Keine Vokabeln erkannt. Versuch ein schärferes Foto oder tipp sie ein.");
  } catch(e){ if (state.draft === d) toast(errText(e)); }
  d.scanning = false; if (state.draft === d && state.tab === "vocab") renderDraft();
}

/* =================== shared: comprehension questions =================== */
function questionsHTML(item, prefix){
  return `<div class="qlist">${item.questions.map((q, qi) => {
    const pick = item.answers[qi];
    return `<fieldset class="q" style="border:0;margin:0;padding:0"><legend class="qt"><span class="n">${qi+1}</span>${esc(q.q)}</legend>
      <div class="opts">${q.options.map((o, oi) => {
        let cls = ""; if (item.checked) { if (oi === q.answer) cls = "right"; else if (pick === oi) cls = "wrong"; }
        return `<label class="opt ${cls}"><input type="radio" name="${prefix}${qi}" value="${oi}" ${pick === oi ? "checked" : ""} ${item.checked ? "disabled" : ""}>${esc(o)}</label>`; }).join("")}</div></fieldset>`;
  }).join("")}</div>`;
}
function bindQuestions(root, item, prefix){
  root.querySelectorAll(`input[type=radio][name^="${prefix}"]`).forEach(r => r.addEventListener("change", () => { item.answers[+r.name.slice(prefix.length)] = +r.value; }));
}
function mcErrors(item){ return item.questions.reduce((n, q, i) => n + (item.answers[i] === q.answer ? 0 : 1), 0); }
function wordsHTML(words){ return words?.length ? `<details><summary class="muted">Wörterhilfe (${words.length})</summary><div class="stack" style="margin-top:8px;gap:4px">${words.map(w => `<span><b style="font-family:var(--en)">${esc(w.en)}</b> – ${esc(w.de)}</span>`).join("")}</div></details>` : ""; }
function normQuestions(arr){ return (Array.isArray(arr) ? arr : []).map(q => ({ q: String(q.q || ""), options: (Array.isArray(q.options) ? q.options : []).map(String).slice(0, 4), answer: Math.round(Number(q.answer)) })).filter(q => q.q && q.options.length >= 2 && q.answer >= 0 && q.answer < q.options.length); }

function playLines(L, from, single){
  const gender = Object.fromEntries((L.speakers || []).map(s => [s.name, s.gender]));
  const parts = [];
  L.lines.forEach((ln, i) => { if (i < from || (single && i !== from)) return; for (const sent of splitSentences(ln.text)) parts.push({ text: sent, gender: gender[ln.who] || "", spk: ln.who, idx: i }); });
  const ok = speakParts(parts, { rate: L.rate === "slow" ? 0.72 : 0.95,
    onPart: i => { L.cur = i; document.querySelectorAll("#ldialog .ln").forEach(el => el.classList.toggle("cur", +el.dataset.ln === i)); },
    onEnd: () => { L.playing = false; L.cur = -1; if (state.tab === "listen" && state.listen === L) renderListen(); } });
  if (!ok) { L.showText = true; renderListen(); return; }
  if (!single) L.plays++;
  L.playing = true; renderListen();
}

  try {

        const val = X.vals[i] ?? ""; const ok = X.checked && isRight(val, it.a); const cls = X.checked ? (ok ? "ok" : "no") : "";
        const [pre, ...rest] = String(it.s).split("___"); const post = rest.join("___");
        const field = Array.isArray(it.o) && it.o.length
          ? `<select data-gi="${i}" class="${cls}" ${X.checked ? "disabled" : ""} aria-label="Lücke ${i+1}"><option value="">…</option>${it.o.map(o => `<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`
          : `<input type="text" data-gi="${i}" class="${cls}" value="${esc(val)}" ${X.checked ? "readonly" : ""} autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" aria-label="Lücke ${i+1}" size="${Math.max(6, Math.min(16, (it.a[0]||"").length + 3))}">`;
        return `<div class="gap"><span class="n">${i+1}</span><span class="s">${esc(pre)}${field}${esc(post)}${X.checked && !ok ? `<span class="fix">→ ${esc(it.a[0])}</span>` : ""}${X.mix && X.checked && !ok && it.from ? ` <span class="muted" style="font-family:var(--body)">(${esc(it.from)})</span>` : ""}</span></div>`;
      }).join("")}</div>
      ${X.checked ? `<div class="result">${stampHTML(X.graded)}<div class="stack"><p style="font-size:20px;font-weight:700">${errs} Fehler bei ${X.items.length} Lücken</p><p class="muted">${errs ? "Rot = falsch, grün daneben die Lösung." : "Alles richtig. Brilliant!"}</p></div></div>
        <div class="row">${errs ? `<button class="grow" id="gagain">Nochmal versuchen</button>` : ""}${g && !OFFLINE ? `<button class="primary grow" id="gmore" ${sample ? "" : "disabled"}>Neue Sätze von Claude</button>` : g ? `<button class="primary grow" id="gmixtopic">Neu mischen</button>` : `<button class="primary grow" id="gremix">Neu mischen</button>`}</div>`
        : `<button class="primary" id="gcheck">Prüfen</button>`}
      ${g && !OFFLINE && !sample && X.checked ? `<p class="muted">Neue Sätze erstellen braucht Claude. Öffne die App angemeldet in Claude.</p>` : ""}
      ${g && !X.checked && sample ? `<button class="small ghost" id="gmore2">Andere Sätze von Claude</button>` : ""}
      <p class="muted" id="gstatus"></p>
    </div>
    <button class="ghost" id="gback">Zurück zu den Themen</button>`;
  const det = $("#grule"); if (det) det.ontoggle = () => { X.showRule = det.open; };
  v.querySelectorAll("[data-gi]").forEach(el => { const h = () => { X.vals[+el.dataset.gi] = el.value; }; el.addEventListener("input", h); el.addEventListener("change", h);
    el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const all = [...v.querySelectorAll("[data-gi]")]; const nx = all[all.indexOf(el) + 1]; if (nx) nx.focus(); else $("#gcheck")?.click(); } }); });
  const ck = $("#gcheck"); if (ck) ck.onclick = () => {
    X.checked = true; const e = X.items.reduce((n, it, i) => n + (isRight(X.vals[i], it.a) ? 0 : 1), 0); X.graded = gradeFor(e);
    if (g) { state.done[g.id] = true; saveSettings(); }
    addResult({ id: uid("r"), at: Date.now(), kind: "grammatik", label: g ? g.t : `Gemischt bis Unit ${state.gramUnit}`, total: X.items.length, errors: e, grade: X.graded });
    renderGram(); };
  const ag = $("#gagain"); if (ag) ag.onclick = () => { X.items.forEach((it, i) => { if (!isRight(X.vals[i], it.a)) X.vals[i] = ""; }); X.checked = false; renderGram(); };
  const rm = $("#gremix"); if (rm) rm.onclick = () => { const pool = []; G.filter(t => t.u <= state.gramUnit).forEach(t => t.x.forEach(x => pool.push({...x, from: t.t}))); state.gram = { topic: null, mix: true, items: shuffle(pool).slice(0, 12), checked: false, vals: [], src: "builtin" }; renderGram(); window.scrollTo(0,0); };
  const mt = $("#gmixtopic"); if (mt) mt.onclick = () => { state.gram = { topic: g.id, items: shuffle(g.x).map(x => ({...x})), checked: false, vals: [], src: "builtin", showRule: false }; renderGram(); window.scrollTo(0,0); };
  const m1 = $("#gmore"); if (m1) m1.onclick = () => moreGram(g);
  const m2 = $("#gmore2"); if (m2) m2.onclick = () => moreGram(g);
  $("#gback").onclick = () => { state.gram = null; renderGram(); window.scrollTo(0,0); };
}
async function moreGram(g){
  if (!sample || !g) return;
  const st = $("#gstatus"); ["#gmore","#gmore2"].forEach(s => { const b = $(s); if (b) { b.disabled = true; b.innerHTML = '<span class="spin"></span> Claude schreibt …'; } });
  if (st) st.textContent = "Das dauert etwa 10–30 Sekunden.";
  const plain = g.r.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
  const ex = g.x.slice(0, 3).map(x => JSON.stringify(x)).join("\n");
  const prompt = `Du bist Englischlehrer, 5. Klasse Gymnasium Bayern (Green Line 1, Unit ${g.u}). Erstelle 10 NEUE Lückensätze zum Grammatikthema "${g.t}".
Regel zum Thema: ${plain}
Regeln:
- Jeder Satz hat genau EINE Lücke "___". Hinter die Lücke oder ans Satzende in Klammern die Grundform bzw. "(not …)" oder eine deutsche Hilfe, wenn nötig – wie in den Beispielen.
- "a": alle richtigen Lösungen für die Lücke (Langform und Kurzform, z. B. ["isn't","is not"]). Nur der Lückeninhalt, nicht der ganze Satz.
- Bei Auswahl-Aufgaben "o": 2–3 Optionen (eine davon richtig). Sonst "o" weglassen.
- Einfacher Wortschatz einer 5. Klasse, Alltag britischer Kinder, abwechslungsreich, eindeutig lösbar.
Beispiele im richtigen Format:
${ex}
Antworte NUR mit JSON: {"items": [{"s": "...", "a": ["..."]}]}`;
  try {
    const r = await sample.json(prompt, { modelTier: "default", cache: false });
    const items = (Array.isArray(r?.items) ? r.items : []).map(x => ({ s: String(x.s || ""), a: (Array.isArray(x.a) ? x.a : [x.a]).map(String).filter(Boolean), o: Array.isArray(x.o) && x.o.length ? x.o.map(String) : undefined }))
      .filter(x => x.s.includes("___") && x.a.length).slice(0, 12);
    if (!items.length) throw { code: "bad" };
    if (state.gram && state.gram.topic === g.id) { state.gram = { topic: g.id, items, checked: false, vals: [], src: "claude", showRule: false }; if (state.tab === "gram") { renderGram(); window.scrollTo(0,0); } }
  } catch(e){ toast(errText(e)); if (state.tab === "gram") renderGram(); }
}

/* =================== NOTEN =================== */
const KIND = { vokabeln: "Vokabeltest", hoeren: "Hören", lesen: "Lesen", grammatik: "Grammatik" };
function renderGrades(){
  const v = $("#v-grades"); const g = state.settings.grades;
  const ranges = []; let lo = 0; let bad = false;
  for (let n = 1; n <= 6; n++) {
    if (n === 6) { ranges.push(`ab ${lo}`); break; }
    const hi = Number(g[n]);
    if (!Number.isFinite(hi) || hi < lo) { ranges.push("entfällt"); if (hi < lo - 1) bad = true; continue; }
    ranges.push(lo === hi ? `${lo}` : `${lo} – ${hi}`); lo = hi + 1;
  }
  v.innerHTML = `
    <div class="card">
      <h2>Wo seid ihr im Buch?</h2>
      <p class="muted">Hören, Lesen und Grammatik starten bei dieser Unit.</p>
      <label class="lbl">Aktuelle Unit${unitSelect("sunit", curUnit())}</label>
    </div>
    <div class="card">
      <h2>Notentabelle</h2>
      <p class="muted">Trag pro Note ein, bis zu wie vielen Fehlern sie gilt. Alles darüber ist eine 6. Gilt für alle Übungen.</p>
      <div class="scroll"><table class="gtable">
        <thead><tr><th>Note</th><th>bis … Fehler</th><th>Fehlerbereich</th></tr></thead>
        <tbody>${[1,2,3,4,5,6].map((n,i) => `<tr><td class="n">${n}</td>
          <td>${n < 6 ? `<input type="number" inputmode="numeric" min="0" step="1" id="g${n}" value="${esc(g[n])}" aria-label="Note ${n}: bis wie viele Fehler">` : `<span class="muted">mehr</span>`}</td>
          <td class="range">${esc(ranges[i] || "")} <span class="muted">· ${GRADE_NAMES[n]}</span></td></tr>`).join("")}</tbody>
      </table></div>
      ${bad ? `<p class="warn">Die Werte sollten von Note 1 bis 5 ansteigen.</p>` : ""}
    </div>
    ${OFFLINE ? `<div class="card">
      <h2>Sicherung</h2>
      <p class="muted">Listen, Noten und Einstellungen sind nur in diesem Browser auf diesem Gerät gespeichert. Wenn der Browserverlauf gelöscht wird, sind sie weg. Mach ab und zu eine Sicherung – damit kannst du die Daten auch auf ein anderes Gerät übertragen.</p>
      <div class="row"><button class="grow" id="bexp">Sicherung speichern</button><button class="grow" id="bimp">Sicherung laden</button></div>
      <input type="file" id="fimp" accept=".json,application/json" hidden>
      ${state.confirmImp ? `<div class="confirm">Alle jetzigen Daten durch die Sicherung ersetzen?<button class="bad small" id="impyes">Ja, ersetzen</button><button class="small" id="impno">Nein</button></div>` : ""}
    </div>` : ""}
    <div class="card">
      <h2>Verlauf</h2>
      ${state.results.length ? `<div class="hist">${state.results.slice(0, 40).map(r => `
        <div class="h"><div><b>${esc(KIND[r.kind] || r.kind)}</b> <span class="muted">· ${esc(r.label || "")}</span><div class="muted">${new Date(r.at).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})} · ${r.errors} Fehler${r.total ? ` / ${r.total}` : ""}</div></div>
        <span class="g" aria-label="Note ${r.grade}">${r.grade}</span></div>`).join("")}</div>`
      : `<p class="muted">Hier erscheinen die Noten deiner Übungen.</p>`}
    </div>`;
  const be = $("#bexp"); if (be) be.onclick = () => {
    const data = JSON.stringify({ app: "english-trainer-5", v: 1, saved: new Date().toISOString(), lists: state.lists, settings: state.settings, results: state.results, done: state.done }, null, 1);
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: "application/json"}));
    a.download = "english-trainer-sicherung-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Sicherung gespeichert (Downloads-Ordner)"); };
  const bi = $("#bimp"), fi = $("#fimp"); if (bi) { bi.onclick = () => fi.click();
    fi.onchange = async () => { const file = fi.files[0]; fi.value = ""; if (!file) return;
      try { const j = JSON.parse(await file.text()); if (j.app !== "english-trainer-5" || !Array.isArray(j.lists)) throw 0; state.pendingImp = j; state.confirmImp = true; renderGrades(); }
      catch(e){ toast("Das ist keine Sicherung dieser App."); } }; }
  const iy = $("#impyes"); if (iy) iy.onclick = () => { const j = state.pendingImp; state.lists = j.lists; if (j.settings) Object.assign(state.settings, j.settings); state.results = Array.isArray(j.results) ? j.results : []; state.done = j.done || {};
    state.pendingImp = null; state.confirmImp = false; state.quizSetup.sel = null; lsSave(); renderGrades(); toast(`Sicherung geladen – ${state.lists.length} Listen`); };
  const ino = $("#impno"); if (ino) ino.onclick = () => { state.pendingImp = null; state.confirmImp = false; renderGrades(); };
  $("#sunit").onchange = e => { state.settings.unit = +e.target.value; state.listenSetup.unit = null; state.readSetup.unit = null; state.gramUnit = null; saveSettings(); toast(`Aktuelle Unit: ${unitLabel(state.settings.unit)}`); };
  let deb;
  for (let n = 1; n <= 5; n++) {
    $("#g" + n).addEventListener("change", e => { const val = parseInt(e.target.value, 10); g[n] = Number.isFinite(val) && val >= 0 ? val : 0;
      clearTimeout(deb); deb = setTimeout(saveSettings, 400); renderGrades(); });
  }
}

/* =================== boot =================== */
lsLoad(); render();
(async () => {
  if (OFFLINE || !window.claude || !window.claude.use) return;
  const [dbNs, sNs] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("sample").catch(() => null)]);
  sample = sNs;
  if (sample) { try { sampleCaps = await sample.limits(); } catch(e){ sampleCaps = null; } }
  db = dbNs;
  if (db) {
    try {
      const [ls, st, rs] = await Promise.all([db.collection("lists").get(), db.doc("settings/app").get(), db.collection("results").orderBy("at","desc").limit(50).get()]);
      const lists = ls.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => Array.isArray(l.words)).sort((a,b) => (a.created||0) - (b.created||0));
      if (lists.length || !state.lists.length) state.lists = lists;
      else { for (const l of state.lists) await saveList(l); }
      if (st.exists) { const s = st.data() || {}; if (s.grades) state.settings.grades = s.grades; if (s.unit) state.settings.unit = s.unit; if (s.done) state.done = s.done; }
      const results = rs.docs.map(d => d.data()); if (results.length) state.results = results;
      lsSave(); $("#sync").textContent = "gespeichert in Claude";
    } catch(e){ $("#sync").textContent = "lokal gespeichert"; }
  }
  state.quizSetup.sel = state.quizSetup.sel?.filter(id => listById(id)); if (!state.quizSetup.sel?.length) state.quizSetup.sel = null;
  if (!state.quiz && !state.draft && !state.listen && !state.read && !state.gram) render();
})();
})();
</script>
